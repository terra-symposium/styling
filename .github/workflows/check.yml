name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      security-events: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run full-scope Quality
        run: pnpm quality:check
        env:
          GH_TOKEN: ${{ github.token }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build && pnpm exec docs build

  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: Terra-Symposium/standards/packages/testing@3d782b9dfc4cc5b421ccbe395d65aacec9d8956d
        with:
          manifest: config/terra-tests.json
